version: '3.8'

services:
  frontend:
    container_name: vuetify-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount the source code for hot-reloading
      - ./frontend:/app
      # Prevent host node_modules from overwriting container node_modules
      - /app/node_modules
    environment:
      - VITE_WS_URL=ws://localhost:8080
      # Use polling for file changes to ensure HMR works across different systems
      - CHOKIDAR_USEPOLLING=true

  backend:
    container_name: websocket-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules